name: Release

on:
  release:
    types:
      - published
  workflow_dispatch:

jobs:
  # Update version in repo before building
  update-version:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.target_commitish || 'main' }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Rust setup
        uses: dtolnay/rust-toolchain@stable

      - name: Update version if release starts with 'v'
        shell: bash
        run: |
          TAG_NAME="${{ github.ref_name }}"
          echo "Release tag: $TAG_NAME"

          if [[ "$TAG_NAME" =~ ^v ]]; then
            VERSION="${TAG_NAME:1}"
            echo "Updating version to: $VERSION"

            # Update package.json
            pnpm version --no-git-tag-version "$VERSION"

            # Update tauri.conf.json
            sed -i "s/\"version\": \"[^\"]*\"/\"version\": \"$VERSION\"/" src-tauri/tauri.conf.json

            # Update Cargo.toml
            sed -i "s/^version = .*/version = \"$VERSION\"/" src-tauri/Cargo.toml

            # Update Cargo.lock to reflect new version
            cd src-tauri && cargo update --workspace && cd ..

            # Commit and push
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add package.json src-tauri/tauri.conf.json src-tauri/Cargo.toml src-tauri/Cargo.lock
            git commit -m "chore: bump version to $VERSION"
            git push
          fi

  # Build GUI app with Tauri (unsigned)
  build:
    needs: update-version
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-latest'
            args: '--target aarch64-apple-darwin'
            arch: 'aarch64'
          - platform: 'macos-latest'
            args: '--target x86_64-apple-darwin'
            arch: 'x64'

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.target_commitish || 'main' }}

      - name: Pull latest (includes version bump)
        run: git pull origin ${{ github.event.release.target_commitish || 'main' }}

      - name: Rust setup
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Rust cache
        uses: swatinem/rust-cache@v2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Install frontend dependencies
        run: pnpm install

      - name: Build Tauri app
        run: pnpm tauri build ${{ matrix.args }}
        env:
          CI: true

      - name: Upload unsigned app bundle
        uses: actions/upload-artifact@v4
        with:
          name: app-bundle-${{ matrix.arch }}
          path: |
            src-tauri/target/*/release/bundle/macos/*.app
          retention-days: 1

  # Sign and notarize the app
  sign:
    needs: build
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: 'aarch64'
            target: 'aarch64-apple-darwin'
          - arch: 'x64'
            target: 'x86_64-apple-darwin'

    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download unsigned app bundle
        uses: actions/download-artifact@v4
        with:
          name: app-bundle-${{ matrix.arch }}
          path: bundle

      - name: Find app bundle
        id: find-app
        run: |
          APP_PATH=$(find bundle -name "*.app" -type d | head -1)
          echo "app_path=$APP_PATH" >> $GITHUB_OUTPUT
          echo "Found app at: $APP_PATH"

      - name: Fix executable permissions
        run: |
          chmod +x "${{ steps.find-app.outputs.app_path }}/Contents/MacOS/"*

      - name: Import Code-Signing Certificates
        uses: Apple-Actions/import-codesign-certs@v2
        with:
          p12-file-base64: ${{ secrets.APPLE_CERTIFICATE }}
          p12-password: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}

      - name: List signing identities
        run: |
          echo "=== Available signing identities ==="
          security find-identity -v -p codesigning
          echo ""
          echo "=== Looking for identity: ${{ secrets.APPLE_SIGNING_IDENTITY }} ==="

      - name: Sign the app
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          echo "Signing app at: ${{ steps.find-app.outputs.app_path }}"
          codesign --deep --force --options runtime \
            --sign "$APPLE_SIGNING_IDENTITY" \
            "${{ steps.find-app.outputs.app_path }}"

          echo "Verifying signature..."
          codesign --verify --deep --strict "${{ steps.find-app.outputs.app_path }}"

      - name: Notarize the app
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          # Create a zip for notarization
          ditto -c -k --keepParent "${{ steps.find-app.outputs.app_path }}" app.zip

          # Submit for notarization
          xcrun notarytool submit app.zip \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" \
            --wait

          # Staple the notarization ticket
          xcrun stapler staple "${{ steps.find-app.outputs.app_path }}"

      - name: Create DMG
        run: |
          # Install create-dmg
          brew install create-dmg

          # Create DMG
          create-dmg \
            --volname "ovim" \
            --window-pos 200 120 \
            --window-size 600 400 \
            --icon-size 100 \
            --app-drop-link 425 178 \
            --icon "ovim.app" 175 178 \
            "ovim_${{ matrix.arch }}.dmg" \
            "${{ steps.find-app.outputs.app_path }}"

      - name: Sign DMG
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          codesign --force --sign "$APPLE_SIGNING_IDENTITY" "ovim_${{ matrix.arch }}.dmg"

      - name: Upload DMG to release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ github.ref_name }}" "ovim_${{ matrix.arch }}.dmg" --clobber --repo "${{ github.repository }}"
