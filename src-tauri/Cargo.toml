[package]
name = "ovim-rust"
version = "0.1.0"
description = "Edit any macOS text field in Neovim"
authors = ["tonis"]
edition = "2021"
default-run = "ovim-rust"

[lib]
name = "ti_vim_rust_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-dialog = "2"
tauri-plugin-global-shortcut = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yml = "0.0"

# macOS frameworks for synthesized key presses and accessibility
core-graphics = "0.25"
core-foundation = "0.10"

# Async runtime for the Neovim RPC connection
tokio = { version = "1", features = ["rt", "time", "net", "io-util"] }

# Neovim RPC for cursor placement and filetype tracking
nvim-rs = { version = "0.9", features = ["use_tokio"] }

# Logging
log = "0.4"
env_logger = "0.11"
chrono = "0.4"

# Directories
dirs = "6"

# UUID for session IDs
uuid = { version = "1", features = ["v4"] }

# Low-level system calls
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
cocoa = "0.26"
objc = "0.2.7"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[lints.rust]
warnings = "deny"
unused = "deny"

[lints.clippy]
all = "deny"
# Selectively enable useful pedantic lints
needless_pass_by_ref_mut = "deny"

[profile.release]
panic = "abort"

[profile.dev]
panic = "abort"
